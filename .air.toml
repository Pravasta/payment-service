# Air — live reload untuk development (auto-rebuild & restart setelah save).
# Jalankan: air   (install: go install github.com/air-verse/air@latest)
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  delay = 1000
  include_ext = ["go", "tpl", "tmpl", "html", "env"]
  exclude_dir = ["tmp", "vendor", "bin", "docs", "scripts", ".git"]
  exclude_regex = ["_test.go"]
  stop_on_error = true

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = true
